# PenLive GRUB menu.
#
# It lives at the ROOT of the PENSYS partition as /grub/grub.cfg. That matters:
# fstab mounts PENSYS on /boot, so this same file is /boot/grub/grub.cfg to the
# running system, /boot/state/nextboot.cfg is ($root)/state/nextboot.cfg here,
# and /boot/extracted/<id>/vmlinuz is ($root)/extracted/<id>/vmlinuz. GRUB's
# view and the manager's view are one layout, which is the whole reason a
# scheduled ISO shows up here at all.
#
# The ESP only carries a two-line stub - find PENSYS by label, then configfile
# into this file - so changing this menu is overwriting a file and no EFI
# binary is ever rebuilt.

set timeout=3
set timeout_style=menu
set default=boot_manager
# If a pending entry cannot be loaded (kernel deleted, partition trimmed),
# GRUB drops to this instead of leaving the user at an error prompt.
set fallback=boot_manager
terminal_output console

# Find PENSYS and point $prefix at it, before anything else. Order matters:
# everything below reads from there.
#
# `search` needs only modules every GRUB build has compiled in, so it works
# while $prefix is still whatever loaded us. The insmods after it do not:
# Debian's signed grubx64.efi carries a fixed built-in set that does not
# include exfat, and looks for the rest in $prefix/x86_64-efi - which, before
# this line, is /EFI/debian on the ESP, where PenLive installs only the stub
# config. That is where "file exfat.mod not found" came from, and with it
# "no such device: PENDATA" (no exFAT driver, so the label cannot be matched)
# and a final "no server is specified" from a GRUB left reading the path as a
# network address. The module tree the builder installs is on PENSYS, so
# $prefix has to name PENSYS before the first insmod runs.
#
# $prefix/grubenv - the pending-boot one-shot - is on PENSYS for the same
# reason.
search --no-floppy --set=root --label PENSYS
set prefix=($root)/grub

# Debian's signed GRUB already embeds the modules needed to reach this ext4
# config and boot Linux. Under shim lockdown, trying to load the unsigned copy
# of any module from PENSYS prints "prohibited by secure boot policy" and can
# leave the pending entry in an error state. The external tree is only needed
# by the standalone/non-Secure-Boot chain (notably for exFAT loopback).
if [ "x$shim_lock" != "xy" ]; then
    insmod part_gpt
    insmod fat
    insmod ext2
    insmod exfat
    insmod search
    insmod search_label
    insmod search_fs_file
    insmod loopback
    insmod iso9660
    insmod chain
    insmod linux
    insmod normal
    insmod echo
    insmod test
fi

menuentry "PenLive Manager" --id boot_manager {
    search --no-floppy --set=root --label PENSYS
    linux ($root)/live/vmlinuz boot=live components quiet splash loglevel=3 vt.global_cursor_default=0 persistence persistence-encryption=none
    initrd ($root)/live/initrd.img
}

# Scheduled boot, armed by the manager and consumed here exactly once.
#
# nextboot.cfg defines the "pending_boot" entry; grubenv's next_entry says
# whether this boot is the one that should take it. Clearing next_entry and
# saving it back before booting is what makes the selection one-shot: the ISO
# starts now, and the reboot after it lands back in PenLive without the user
# having to cancel anything. (PenLive also deletes a nextboot.cfg written
# before the running kernel started, so a selection never outlives the boot it
# was made for.)
if [ -f ($root)/state/nextboot.cfg ]; then
    source ($root)/state/nextboot.cfg
    # Bare load_env/save_env (i.e. $prefix/grubenv, pinned above) rather than
    # -f: it is the path every GRUB build handles, signed ones included.
    # Naming next_entry keeps an unexpected variable in the block from
    # overwriting anything set here.
    if [ -s $prefix/grubenv ]; then
        load_env next_entry
    fi
    if [ "x$next_entry" = "xpending_boot" ]; then
        set next_entry=
        save_env next_entry
        set default=pending_boot
        # Briefly visible on purpose: on firmware that always needs F12 for
        # removable media, seeing the entry highlighted is the confirmation
        # that the USB's own GRUB picked the request up.
        set timeout=2
    fi
fi

source ($root)/grub/recovery.cfg
