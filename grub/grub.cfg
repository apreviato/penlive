# BootStack GRUB menu — lives on BOOTSYS at /boot/grub/grub.cfg, loaded via the
# minimal embedded config baked into EFI/BOOT/BOOTX64.EFI by grub-mkstandalone
# (that embedded config just does `search --label BOOTSYS` + `configfile` to
# reach this file, so updating menu logic is a plain file overwrite, no
# re-flashing of the EFI partition needed).
#
# GRUB has no delete/rm and only bounded integer comparisons (no increment
# operator), which shapes two things below: the pending-boot watchdog counts
# up to 3 via an explicit if/elif chain instead of `boot_attempts += 1`, and
# "clear pending boot" (in recovery.cfg) boots into the live manager with a
# cmdline flag rather than deleting nextboot.cfg itself — the manager deletes
# it once it's running, since only it can.

# Short timeout so a normal boot goes straight into the app. The menu is still
# shown rather than hidden: it is the only route to Recovery, and a user whose
# machine won't boot cannot be expected to guess a hidden keypress.
set timeout=3
set timeout_style=menu
set default=boot_manager
terminal_output console

insmod part_gpt
insmod fat
insmod ext2
insmod exfat
insmod search
insmod search_label
insmod search_fs_file
insmod loopback
insmod iso9660
insmod chain
insmod linux
insmod linuxefi
insmod normal
insmod echo
insmod test

search --no-floppy --set=root --label BOOTSYS

if [ -f ($root)/boot/state/bootenv ]; then
    load_env -f ($root)/boot/state/bootenv
fi
if [ "x$boot_attempts" = "x" ]; then
    set boot_attempts=0
fi

menuentry "BootStack Manager" --id boot_manager {
    insmod ext2
    search --no-floppy --set=root --label BOOTSYS
    linux ($root)/live/vmlinuz boot=live components quiet splash loglevel=3 vt.global_cursor_default=0 persistence persistence-encryption=none
    initrd ($root)/live/initrd.img
}

# Pending boot: written by the manager daemon as a full menuentry (--id
# pending_boot) that knows how to boot the selected OS. We only decide
# *whether* to source it and how many more attempts it gets.
if [ -f ($root)/boot/state/nextboot.cfg ]; then
    if [ "$boot_attempts" -ge "3" ]; then
        echo "Pending boot disabled after 3 failed attempts - see Recovery."
    else
        if [ "$boot_attempts" = "0" ]; then
            set boot_attempts=1
        elif [ "$boot_attempts" = "1" ]; then
            set boot_attempts=2
        else
            set boot_attempts=3
        fi
        save_env -f ($root)/boot/state/bootenv boot_attempts

        source ($root)/boot/state/nextboot.cfg
        set default=pending_boot
    fi
fi

source ($root)/boot/grub/recovery.cfg
