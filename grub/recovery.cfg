# Always reachable even if a pending-boot entry is malformed, since it's
# sourced unconditionally at the end of grub.cfg rather than gated behind
# anything that could itself fail to load.

submenu "Recovery" {
    menuentry "Recovery Manager (safe mode, no persistence)" {
        insmod ext2
        search --no-floppy --set=root --label PENSYS
        linux ($root)/live/vmlinuz boot=live components nopersistence nosplash
        initrd ($root)/live/initrd.img
    }

    menuentry "Ignore pending boot and start Manager" {
        insmod ext2
        search --no-floppy --set=root --label PENSYS
        linux ($root)/live/vmlinuz boot=live components quiet
        initrd ($root)/live/initrd.img
    }

    menuentry "Clear pending boot (Manager deletes it on next start)" {
        insmod ext2
        search --no-floppy --set=root --label PENSYS
        set boot_attempts=0
        save_env -f ($root)/boot/state/bootenv boot_attempts
        linux ($root)/live/vmlinuz boot=live components penlive.clear_pending=1
        initrd ($root)/live/initrd.img
    }

    menuentry "Reboot" {
        reboot
    }

    menuentry "Power off" {
        halt
    }

    menuentry "GRUB command line" {
        insmod normal
        normal
    }
}
