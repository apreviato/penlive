[project]
name = "penlive-builder"
version = "0.1.0"
description = "CLI that partitions, formats and provisions a PenLive live-USB from a built live system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
penlive = "penlive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
