<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <title>PenLive Manager</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #050607; }

      /* Deliberately inline and deliberately identical to the kiosk's boot
         splash (live/.../opt/penlive/loading.html). The live system reads this
         bundle off a compressed squashfs on a USB stick, so there are seconds
         between this document painting and React mounting. Anything that waits
         on the stylesheet or the script leaves that gap black, which is exactly
         what the kiosk looks like when it has crashed. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050607;
        color: #f2f6fb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot-splash .inner { display: flex; flex-direction: column; align-items: center; }
      #boot-splash .mark {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        color: #4f9cff;
        border: 1px solid rgba(79, 156, 255, .32);
        border-radius: 22px;
        background: rgba(79, 156, 255, .14);
      }
      #boot-splash h1 { margin: 18px 0 7px; font-size: 24px; letter-spacing: -.3px; }
      #boot-splash p { display: flex; align-items: center; gap: 9px; margin: 0; color: #a7b3c7; font-size: 13px; }
      #boot-splash .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #292e35;
        border-top-color: #4f9cff;
        border-radius: 50%;
        animation: boot-spin .7s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="inner">
        <div class="mark" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M9 3h6v3l2.5 2.5V19a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V8.5L9 6V3Z" />
            <path d="M9 6h6M9.5 12h5M9.5 16h5" />
          </svg>
        </div>
        <h1>PenLive</h1>
        <p><span class="spinner"></span> Starting the manager…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
